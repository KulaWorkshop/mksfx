[package]
name = "mksfx"
version = "1.0.0"
description = "A command-line utility for modifying SFX files from Kula Quest."
authors = ["Brandon Gardenhire (@saturnkai)"]
license = "MIT"
repository = "https://github.com/kulaworkshop/mksfx"
edition = "2024"

[profile.release]
strip = true
lto = true
codegen-units = 1

[dependencies]
byteorder = "1.5.0"
clap = { version = "4.5.48", features = ["derive"] }
colored = "3.0.0"
hound = "3.5.1"
libc = "0.2.176"
serde = { version = "1.0.227", features = ["derive"] }
serde_yaml = "0.9.34"

[build-dependencies]
cc = "1.2.39"
